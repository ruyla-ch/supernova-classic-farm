version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: server/gen
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.13.0
    out: web/src/gen
    opt:
      - target=ts
    types:
      - classicfarm.http.v1
      - classicfarm.ws.v1
      - classicfarm.ws.v1.chapter
      - classicfarm.ws.v1.plot
      - classicfarm.ws.v1.reason
